name: Check and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build website
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            export VITE_API_URL="${VITE_API_URL:-http://127.0.0.1:8787}"
          fi
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            node -e 'const url = new URL(process.env.VITE_API_URL); if (url.protocol !== "https:" || url.href !== url.origin + "/" || !url.hostname.endsWith(".workers.dev")) throw new Error("Set VITE_API_URL to the HTTPS workers.dev origin")'
          fi
          npm run build
      - name: Upload website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
